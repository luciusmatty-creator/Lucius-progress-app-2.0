<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>MyProgress</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0;padding:20px 16px 48px}.app{max-width:680px;margin:auto}h1{font-size:30px;margin:4px 0}p{color:#6b7280}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0000000d}.row{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:130px;background:#f9fafb;border-radius:14px;padding:14px}.big{font-size:28px;font-weight:750}.label{font-size:13px;color:#6b7280}.bar{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#111827;width:0}.btn{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:650;cursor:pointer;background:#111827;color:white;min-height:46px}.btn.secondary{background:#e5e7eb;color:#111827}.btn.danger{background:#991b1b}.btn:disabled{opacity:.45}input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:white;margin:6px 0 12px}label{font-size:14px;font-weight:650}.entry{border-top:1px solid #e5e7eb;padding:12px 0;display:flex;justify-content:space-between;gap:12px}.entry:first-child{border-top:0}.muted{color:#6b7280;font-size:13px}.good{color:#166534}.over{color:#991b1b}.tabs{display:flex;gap:8px;margin:14px 0}.tab{flex:1}.hidden{display:none}.footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="app">
<h1>MyProgress</h1><p id="todayText"></p>
<div class="tabs"><button class="btn tab" data-tab="today">Today</button><button class="btn secondary tab" data-tab="history">History</button><button class="btn secondary tab" data-tab="settings">Settings</button></div>
<section id="today">
<div class="card"><h2>Cigarettes</h2><div class="row"><div class="stat"><div class="label">Today</div><div class="big"><span id="smoked">0</span>/<span id="limit">3</span></div></div><div class="stat"><div class="label">Remaining</div><div class="big" id="remaining">3</div></div></div><div class="bar"><div class="fill" id="smokeBar"></div></div><p id="smokeStatus"></p><div class="row"><button class="btn" id="addSmoke">+1 Cigarette</button><button class="btn secondary" id="undoSmoke">Undo</button></div></div>
<div class="card"><h2>Workout</h2><form id="workoutForm"><label>Workout type</label><select id="type"><option>Run</option><option>Gym</option><option>Walk</option><option>Cycle</option><option>Other</option></select><div class="row"><div style="flex:1;min-width:140px"><label>Duration, minutes</label><input id="duration" type="number" min="0" max="1440" placeholder="30"></div><div style="flex:1;min-width:140px"><label>Distance, km</label><input id="distance" type="number" min="0" step="0.01" placeholder="4.5"></div></div><label>Note</label><textarea id="note" rows="2" placeholder="How did today's workout go?"></textarea><button class="btn" type="submit">Save Workout</button></form><div id="todayWorkouts"></div></div>
<div class="card"><h2>This week</h2><div class="row"><div class="stat"><div class="label">Workouts</div><div class="big" id="weekWorkouts">0</div></div><div class="stat"><div class="label">Cigarettes</div><div class="big" id="weekSmokes">0</div></div><div class="stat"><div class="label">Days within limit</div><div class="big" id="withinDays">0</div></div></div></div>
</section>
<section id="history" class="hidden"><div class="card"><h2>Last 7 days</h2><div id="historyList"></div></div></section>
<section id="settings" class="hidden"><div class="card"><h2>Your cigarette limit</h2><label>Maximum cigarettes per day</label><input id="limitInput" type="number" min="0" max="100"><button class="btn" id="saveLimit">Save Limit</button></div><div class="card"><h2>Backup</h2><p>Your records stay in this browser on this device.</p><div class="row"><button class="btn secondary" id="exportBtn">Export Backup</button><label class="btn secondary" style="display:inline-flex;align-items:center">Import Backup<input id="importFile" type="file" accept="application/json" style="display:none"></label></div></div><div class="card"><h2>Reset</h2><button class="btn danger" id="resetBtn">Delete All App Data</button></div></section>
<div class="footer">MyProgress • Workout and cigarette reduction tracker</div>
</div>
<script>
const KEY='myprogress-v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{limit:3,smokes:{},workouts:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function lastDates(n){let a=[];for(let i=0;i<n;i++){let d=new Date();d.setDate(d.getDate()-i);a.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)}return a}
function render(){const t=today(),s=data.smokes[t]||0,l=Math.max(0,Number(data.limit)||0),r=Math.max(0,l-s);document.getElementById('smoked').textContent=s;document.getElementById('limit').textContent=l;document.getElementById('remaining').textContent=r;document.getElementById('smokeBar').style.width=(l===0?(s?100:0):Math.min(100,s/l*100))+'%';const status=document.getElementById('smokeStatus');status.textContent=s<=l?`You are within today's limit. ${r} remaining.`:`You are ${s-l} over today's limit.`;status.className=s<=l?'good':'over';document.getElementById('limitInput').value=l;const tw=data.workouts.filter(w=>w.date===t);document.getElementById('todayWorkouts').innerHTML=tw.length?'<h3>Today\'s entries</h3>'+tw.map(w=>`<div class="entry"><div><strong>${w.type}</strong><div class="muted">${w.duration?`${w.duration} min `:''}${w.distance?`${w.distance} km`:''}${w.note?` • ${escapeHtml(w.note)}`:''}</div></div><button class="btn secondary" data-del="${w.id}">Delete</button></div>`).join(''):'<p class="muted">No workout logged yet.</p>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data.workouts=data.workouts.filter(w=>w.id!==b.dataset.del);save()});const dates=lastDates(7);document.getElementById('weekWorkouts').textContent=data.workouts.filter(w=>dates.includes(w.date)).length;document.getElementById('weekSmokes').textContent=dates.reduce((a,d)=>a+(data.smokes[d]||0),0);document.getElementById('withinDays').textContent=dates.filter(d=>(data.smokes[d]||0)<=l).length;document.getElementById('historyList').innerHTML=dates.map(d=>{const ws=data.workouts.filter(w=>w.date===d);return `<div class="entry"><div><strong>${d}</strong><div class="muted">${ws.length} workout${ws.length===1?'':'s'}${ws.length?' • '+ws.map(w=>w.type).join(', '):''}</div></div><div>${data.smokes[d]||0}/${l} cigs</div></div>`}).join('')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.getElementById('todayText').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
document.getElementById('addSmoke').onclick=()=>{data.smokes[today()]=(data.smokes[today()]||0)+1;save()};document.getElementById('undoSmoke').onclick=()=>{data.smokes[today()]=Math.max(0,(data.smokes[today()]||0)-1);save()};document.getElementById('workoutForm').onsubmit=e=>{e.preventDefault();const duration=Math.max(0,Number(document.getElementById('duration').value)||0),distance=Math.max(0,Number(document.getElementById('distance').value)||0);data.workouts.push({id:String(Date.now()),date:today(),type:document.getElementById('type').value,duration,distance,note:document.getElementById('note').value.trim()});e.target.reset();save()};document.getElementById('saveLimit').onclick=()=>{data.limit=Math.max(0,Math.min(100,Number(document.getElementById('limitInput').value)||0));save()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.add('secondary'));b.classList.remove('secondary')});document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='myprogress-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(typeof x.limit!=='number'||!x.smokes||!Array.isArray(x.workouts))throw 0;data=x;save();alert('Backup imported.')}catch{alert('This backup file is not valid.')}};r.readAsText(f)};document.getElementById('resetBtn').onclick=()=>{if(confirm('Delete all MyProgress data from this device?')){data={limit:3,smokes:{},workouts:[]};save()}};render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
